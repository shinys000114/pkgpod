[package]
name = "pkgpod"
description = "pkgpod: a team package server (serve) and its command line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pkgpod"
path = "src/main.rs"

[dependencies]
pkgpod-base.workspace = true
pkgpod-server.workspace = true
clap.workspace = true
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc.workspace = true
libc.workspace = true
rustix.workspace = true
jiff.workspace = true

[dev-dependencies]
pkgpod-deb = { workspace = true, features = ["testutil"] }
tempfile.workspace = true
reqwest = { workspace = true, features = ["form"] }
serde_json.workspace = true
