<div class="plan done">
  <p><b>{{ title }}</b></p>
  {% if lines.is_empty() %}<p class="muted">No changes.</p>{% endif %}
  <ul class="changes">{% for l in lines %}<li class="mono" data-sign="{{ l.sign }}">{{ l.sign }} {{ l.path }}</li>{% endfor %}</ul>
  {% if more > 0 %}<p class="muted">… and {{ more }} more</p>{% endif %}
</div>
