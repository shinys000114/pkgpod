<div class="job-log"{% if running %} data-stream="/jobs/{{ id }}/stream?from={{ from }}"{% endif %}>
  <div class="card-head"><h2><span class="badge job-state {% if state == "ok" %}ok{% else if running %}run{% else %}bad{% endif %}">{{ state }}</span></h2>
    {% if running %}<button class="danger job-stop" hx-post="/c/jobs/{{ id }}/cancel" hx-target="next .result">Stop</button>{% endif %}</div>
  <div class="result card-body"></div>
  <pre class="log">{{ log }}</pre>
</div>
