<div class="card">
  <div class="card-head"><h2>How to use</h2><span class="hint">commands for this repository's clients, with its address</span></div>
  <div class="card-body use">
  {% for u in usage %}<div class="use-step">
    <p class="use-label">{{ u.label }}</p>
    <div class="code"><pre class="log">{{ u.text }}</pre><button class="copy" type="button" aria-label="Copy">Copy</button></div>
  </div>{% endfor %}
  {% if usage.is_empty() %}<p class="empty">Nothing to say for this repository yet.</p>{% endif %}
  </div>
</div>
