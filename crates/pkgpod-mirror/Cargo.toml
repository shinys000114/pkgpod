[package]
name = "pkgpod-mirror"
description = "pkgpod mirror engines: apt, dnf and Arch repositories over HTTP, rsync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pkgpod-base.workspace = true
pkgpod-deb.workspace = true
reqwest.workspace = true
thiserror.workspace = true
flate2.workspace = true
liblzma.workspace = true
zstd.workspace = true
bzip2.workspace = true
quick-xml.workspace = true
tar.workspace = true
glob.workspace = true
httpdate.workspace = true
rustix.workspace = true
time.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }

[dev-dependencies]
pkgpod-deb = { workspace = true, features = ["testutil"] }
tempfile.workspace = true
axum.workspace = true
tower-http = { workspace = true, features = ["fs"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "fs", "io-util"] }
futures-util.workspace = true
