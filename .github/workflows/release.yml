# SPDX-License-Identifier: AGPL-3.0-only
# A tag v<semver> runs every check of ci.yml on the tagged commit, with
# the packages built as that version; the release gets the packages that
# passed them (linted and install-tested), not a build of its own.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  # The only job that can write to the repository, and it runs no code
  # from it.
  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # v0.1.0-rc1 and the like.
          prerelease: ${{ contains(github.ref_name, '-') }}
