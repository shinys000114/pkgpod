# SPDX-License-Identifier: AGPL-3.0-only
# Publishes master's build to a pkgpod server with trusted publishing: the
# job logs in with its GitHub OIDC token, so no secret is kept here. It runs
# only where the repository variables PKGPOD_URL (the server's console and
# API address) and PKGPOD_REPO (a files repository there) are set, and the
# server has a trust rule for this repository's publish.yml on master
# (master/latest/ then always serves the newest build):
#
#   pkgpod trust add publish --github <owner>/<name> --ref refs/heads/master \
#     --workflow publish.yml --user <ci user> --repos <PKGPOD_REPO>
#
# What it uploads is what ci.yml built and tested in this run: nothing is
# published, and master/latest does not move, unless every check passed.
# (Where publishing is set up, a push to master runs those checks twice:
# here and in ci.yml's own run.)
name: publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: vars.PKGPOD_URL != '' && vars.PKGPOD_REPO != ''
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One at a time, none cancelled half way: a newer push cancels the
    # checks of an older one, so the newest build is the last uploaded.
    concurrency:
      group: publish-master
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist
      - name: Where
        id: at
        run: echo "dir=master/${GITHUB_SHA::7}/" >> "$GITHUB_OUTPUT"
      # The action in this repository: the pkgpod command from the server,
      # the job's OIDC token, one upload (one version; one request, which a
      # CDN in front may limit: 100 MB at Cloudflare's free plan, this is
      # about 66 MiB).
      - uses: ./
        with:
          url: ${{ vars.PKGPOD_URL }}
          repository: ${{ vars.PKGPOD_REPO }}
          files: dist/*.deb dist/pkgpod_0.0.0-ci_linux_* dist/THIRD-PARTY-NOTICES dist/checksums.txt
          path: ${{ steps.at.outputs.dir }}
          link: master/latest
      - name: Summary
        env:
          REPO: ${{ vars.PKGPOD_REPO }}
          DIR: ${{ steps.at.outputs.dir }}
        run: echo "published to $REPO at $DIR" >> "$GITHUB_STEP_SUMMARY"
