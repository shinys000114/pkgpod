# SPDX-License-Identifier: AGPL-3.0-only
# Publishes master's build to a pkgpod server with trusted publishing: the
# job logs in with its GitHub OIDC token, so no secret is kept here. It runs
# only where the repository variables PKGPOD_URL (the server's console and
# API address) and PKGPOD_REPO (a files repository there) are set, and the
# server has a trust rule for this repository's publish.yml on master
# (master/latest/ then always serves the newest build):
#
#   pkgpod trust add publish --github <owner>/<name> --ref refs/heads/master \
#     --workflow publish.yml --user <ci user> --repos <PKGPOD_REPO>
name: publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: vars.PKGPOD_URL != '' && vars.PKGPOD_REPO != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build
        with:
          version: 0.0.0-ci
      - name: Where
        id: at
        run: echo "dir=master/${GITHUB_SHA::7}/" >> "$GITHUB_OUTPUT"
      # The action in this repository: the pkgpod command from the server,
      # the job's OIDC token, one upload (one version; one request, which a
      # CDN in front may limit: 100 MB at Cloudflare's free plan, this is
      # about 66 MiB).
      - uses: ./
        with:
          url: ${{ vars.PKGPOD_URL }}
          repository: ${{ vars.PKGPOD_REPO }}
          files: dist/*.deb dist/pkgpod_0.0.0-ci_linux_* dist/checksums.txt
          path: ${{ steps.at.outputs.dir }}
          link: master/latest
      - run: echo "published to ${{ vars.PKGPOD_REPO }} at ${{ steps.at.outputs.dir }}" >> "$GITHUB_STEP_SUMMARY"
